<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정조네 화성 신입 공채</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#1B2430; --muted:#5B6672; --line:#D5DDD8; --soft:#F5F7F5;
  --navy:#24406B; --A:#4F6E96; --B:#A97A12; --C:#C2506A; --D:#D0642A; --seal:#C23B2C;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101820; --surface:#18232F; --ink:#E6EBE8; --muted:#9AA6B1; --line:#2B3947; --soft:#1E2A37;
    --navy:#8FB0DE; --A:#8FB0DE; --B:#E2B655; --C:#EE8FA5; --D:#F29A5E; --seal:#EE6B5B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101820; --surface:#18232F; --ink:#E6EBE8; --muted:#9AA6B1; --line:#2B3947; --soft:#1E2A37;
  --navy:#8FB0DE; --A:#8FB0DE; --B:#E2B655; --C:#EE8FA5; --D:#F29A5E; --seal:#EE6B5B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
main{max-width:560px;margin:0 auto;padding:26px 20px 40px}
main.wide{max-width:1000px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
svg.ch{display:block}

/* 성곽 여장 */
.wall{height:18px;margin-bottom:22px;
  background:
    linear-gradient(var(--navy),var(--navy)) bottom/100% 8px no-repeat,
    repeating-linear-gradient(90deg,var(--navy) 0 20px,transparent 20px 32px) top/100% 10px no-repeat}

.crew{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:end;margin-bottom:6px}
.crew figure{margin:0;text-align:center}
.crew svg{width:100%;max-width:96px;margin:0 auto}
.crew figcaption{font-family:var(--display);font-size:14px;color:var(--muted)}
.crew figure:nth-child(odd) svg{animation:bob 2.6s ease-in-out infinite}
.crew figure:nth-child(even) svg{animation:bob 2.6s ease-in-out .5s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){.crew svg{animation:none!important}}

.year{margin-top:22px;font-size:15px;color:var(--muted)}
.title{margin-top:2px;font-size:clamp(44px,12.5vw,62px);line-height:1.12}
.lede{margin-top:14px;max-width:30em}
.field{margin-top:28px}
.field label{display:block;font-weight:600;margin-bottom:8px}
select,input[type=password]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.primary{display:block;width:100%;margin-top:14px;padding:15px 18px;border:0;border-radius:14px;background:var(--navy);color:var(--bg);font-family:var(--display);font-size:20px}
.primary:disabled{opacity:.4;cursor:not-allowed}
.secondary{display:block;width:100%;margin-top:14px;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:transparent;font-weight:600}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.textlink{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 0;font-size:14px}
.foot{margin-top:52px;text-align:center;display:grid;gap:8px;justify-items:center}
.event{font-family:var(--display);font-size:18px;color:var(--muted)}

/* 문제 */
.progress{display:flex;gap:6px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--navy)}
.count{margin-top:16px;font-family:var(--display);font-size:20px;color:var(--seal)}
.scene{margin-top:2px;color:var(--muted);font-size:15px}
.question{margin-top:8px;font-size:clamp(26px,6.8vw,32px);line-height:1.35}
.opts{margin-top:24px;display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:15px 18px;line-height:1.5;transition:transform .08s}
.opt:hover{border-color:var(--navy)}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--soft)}
.back{margin-top:20px}

/* 합격 통지 */
.card{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:26px 22px 26px;overflow:hidden}
.hero{display:grid;place-items:center;background:var(--soft);border-radius:16px;padding:18px 0 10px}
.hero svg{width:150px;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.hero p{font-family:var(--display);font-size:17px;color:var(--c);margin-top:4px}
.seal{position:absolute;top:18px;right:18px;width:70px;height:70px;display:grid;place-items:center;
  border:3px solid var(--seal);color:var(--seal);border-radius:50%;font-family:"Nanum Myeongjo","Batang",serif;font-weight:700;font-size:21px;line-height:1.05;text-align:center;
  transform:rotate(-12deg);animation:stamp .5s cubic-bezier(.2,1.4,.4,1) .55s both;background:var(--surface)}
@keyframes stamp{from{transform:scale(2.2) rotate(-24deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
@media (prefers-reduced-motion: reduce){.seal,.hero svg{animation:none}}
.pass{margin-top:20px;font-family:var(--display);font-size:18px;color:var(--muted)}
.to{margin-top:2px;font-size:22px;font-weight:600}
.post{margin-top:2px;font-size:clamp(34px,9.5vw,42px);line-height:1.15;color:var(--c)}
.postsub{margin-top:4px;color:var(--muted);font-size:15px}
.quote{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--soft);font-size:15px}
.quote b{font-family:var(--display);font-weight:400;color:var(--c)}
.sect{margin-top:22px}
.sect h3{font-size:19px;margin-bottom:8px}
.talent{display:flex;gap:8px;flex-wrap:wrap}
.talent span{padding:5px 12px;border-radius:999px;border:1.5px solid var(--c);color:var(--c);font-size:14px;font-weight:600}
.course{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.course li{display:grid;grid-template-columns:3.2em 1fr;gap:10px;align-items:start;padding:11px 12px;border-radius:12px;background:var(--soft);font-size:15px}
.course .k{font-family:var(--display);color:var(--c);font-size:16px}
.course .p{font-weight:600}
.course .d{display:block;color:var(--muted);font-size:14px}
.mission{display:grid;gap:4px;padding-left:1.2em;margin:0}
.note{margin-top:12px;font-size:14px;color:var(--muted)}

/* 방목 */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:22px}
.team{border:1.5px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.team header{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1.5px solid var(--line)}
.team header svg{width:52px;flex:none}
.team header h2{font-size:21px;color:var(--tc)}
.team header p{font-size:13px;color:var(--muted)}
.team ul{list-style:none;margin:0;padding:0}
.team li{display:flex;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--line);font-size:14px}
.team li:first-child{border-top:0}
.team li small{color:var(--muted)}
.msg{margin-top:10px;font-size:14px;color:var(--seal)}
</style>
</head>

<main id="app"></main>

  {s:"행차 첫날, 한강 배다리",q:"배를 엮어 만든 다리를 건너는 중. 나는?",o:[["D","맨 앞에서 “길 비켜라~”"],["A","배를 어떻게 묶었는지 들여다보기"],["C","건너편 국밥집 검색 중"],["B","강 풍경 연사 촬영 중"]]},
  {s:"화성 출장 중 갑자기 생긴 반차",q:"남는 시간에 뭐 할까?",o:[["C","장터 먹방 투어"],["D","팔달산 올라 서장대까지"],["A","공방 원데이클래스"],["B","방화수류정에서 멍때리며 스케치"]]},
  {s:"혜경궁 마마 생신 파티 준비",q:"내가 맡고 싶은 담당은?",o:[["A","타임테이블과 동선"],["B","데코와 포토존"],["C","케이크와 메뉴"],["D","짐 나르기와 의자 세팅"]]},
  {s:"서장대 야간 훈련 날",q:"정조가 직접 지휘하는 밤 훈련! 나는?",o:[["D","횃불 들고 성곽 질주"],["A","“신호 체계 개선안” 제출"],["B","횃불 야경 인생샷"],["C","야식 주문 접수"]]},
  {s:"파발 단톡방",q:"단톡방에서 나는 주로",o:[["C","맛집 링크 투척"],["D","“지금 모여” 번개 소집"],["A","공지 깔끔 정리"],["B","짤 생성기"]]},
  {s:"행차 끝, 보너스 지급",q:"정조가 선물 하나 주신다면?",o:[["B","최고급 붓 세트"],["C","수라간 레시피북"],["D","장용영 각궁"],["A","거중기 설계도"]]},
  {s:"환궁 후 첫 퇴근길",q:"나를 충전시키는 건?",o:[["A","혼자 조물조물 만들기"],["C","따끈한 국밥 한 그릇"],["B","음악 듣고 사진 정리"],["D","동네 한 바퀴 걷기"]]}
];
const PIN="1795";
const app=document.getElementById("app");
const S={view:"intro",who:"",step:0,ans:[]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const foot=extra=>`<div class="foot">${extra||""}<p class="event">11/5 채널컨설팅 플레이샵</p></div>`;
const toTop=()=>window.scrollTo(0,0);

function render(){
  app.className=S.view==="board"?"wide":"";
  ({intro:renderIntro,quiz:renderQuiz,result:renderResult,pin:renderPin,board:renderBoard})[S.view]();
}
function renderIntro(){
  const groups=Object.keys(ORGS).map(o=>`<optgroup label="${ORGS[o]}">`+
    PEOPLE.map((p,i)=>p.o==o?`<option value="${i}" ${S.who===String(i)?"selected":""}>${esc(p.n)}</option>`:"").join("")+`</optgroup>`).join("");
  app.innerHTML=`
    <div class="wall" aria-hidden="true"></div>
    <div class="crew">${T.map(t=>`<figure>${CH[t]}<figcaption>${TYPES[t].chr}</figcaption></figure>`).join("")}</div>
    <p class="year">1795년 을묘년 화성 별시</p>
    <h1 class="title">정조네<br>화성 신입 공채</h1>
    <p class="lede">정조가 화성에서 함께 일할 신입을 뽑아요. 여덟 문제만 풀면 내가 발령날 부서와 오늘의 코스가 나와요.</p>
    <div class="field">
      <label for="who">지원자 이름</label>
      <select id="who"><option value="">이름을 골라주세요</option>${groups}</select>
      <button class="primary" id="start" ${S.who===""?"disabled":""}>지원서 내기</button>
    </div>
    ${foot(`<button class="textlink" id="toBoard">진행자용 발령 명단</button>`)}`;
  const sel=document.getElementById("who"),btn=document.getElementById("start");
  sel.onchange=()=>{S.who=sel.value;btn.disabled=S.who===""};
  btn.onclick=()=>{S.step=0;S.ans=[];S.view="quiz";render();toTop()};
  document.getElementById("toBoard").onclick=()=>{S.view="pin";render()};
}
function renderQuiz(){
  const it=Q[S.step];
  app.innerHTML=`
    <div class="progress" aria-hidden="true">${Q.map((_,i)=>`<i class="${i<=S.step?"on":""}"></i>`).join("")}</div>
    <p class="count">제${S.step+1}문</p>
    <p class="scene">${esc(it.s)}</p>
    <h2 class="question">${esc(it.q)}</h2>
    <div class="opts">${it.o.map(([k,t])=>`<button class="opt" data-k="${k}" aria-pressed="${S.ans[S.step]===k}">${esc(t)}</button>`).join("")}</div>
    <button class="ghost back" id="back">${S.step===0?"처음으로":"앞 문제로"}</button>
    ${foot()}`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    S.ans[S.step]=b.dataset.k;
    if(S.step<Q.length-1){S.step++;render()}else{S.view="result";render();toTop()}
  });
  document.getElementById("back").onclick=()=>{if(S.step===0)S.view="intro";else S.step--;render()};
}
function renderResult(){
  const idx=Number(S.who),p=PEOPLE[idx],t=ROSTER[idx],ty=TYPES[t];
  const c={A:0,B:0,C:0,D:0};S.ans.forEach(k=>c[k]++);
  const tal=[...T].sort((a,b)=>c[b]-c[a]).filter((k,i)=>i<2&&c[k]>0);
  app.innerHTML=`
    <article class="card" style="--c:var(--${t})">
      <div class="seal" aria-hidden="true">及<br>第</div>
      <div class="hero">${CH[t]}<p>사수 ${ty.chr}</p></div>
      <p class="pass">축 최종 합격!</p>
      <p class="to">${esc(p.n)}님은</p>
      <h2 class="post">${ty.post}<span style="color:var(--ink)">으로 발령!</span></h2>
      <p class="postsub">${ty.sub}</p>
      <p class="quote"><b>${ty.chr}</b> “${ty.says}”</p>
      <p class="desc" style="margin-top:12px;color:var(--muted)">${ty.desc}</p>
      <div class="sect">
        <h3>면접관이 본 나의 강점</h3>
        <div class="talent">${tal.map(k=>`<span>${TALENT[k]}</span>`).join("")}</div>
        <p class="note">정조가 강점과 부서 케미를 함께 보고 발령 냈어요.</p>
      </div>
      <div class="sect">
        <h3>오늘의 근무 코스</h3>
        <ul class="course">${ty.course.map(([k,pl,d])=>`<li><span class="k">${k}</span><span><span class="p">${esc(pl)}</span><span class="d">${esc(d)}</span></span></li>`).join("")}</ul>
        <p class="note">12:50 화성행궁 앞에서 부서별로 출발해서, 16:00에 방화수류정에서 다 같이 만나요.</p>
      </div>
      <div class="sect">
        <h3>오늘의 어명</h3>
        <ul class="mission">${ty.mission.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>
      </div>
    </article>
    <button class="secondary" id="again">처음 화면으로</button>
    ${foot()}`;
  document.getElementById("again").onclick=()=>{S.view="intro";render();toTop()};
}
function renderPin(){
  app.innerHTML=`
    <div class="wall" aria-hidden="true"></div>
    <h1 style="font-size:34px">진행자용 발령 명단</h1>
    <p class="lede" style="color:var(--muted)">PIN을 입력하면 네 부서의 전체 명단을 볼 수 있어요.</p>
    <div class="field">
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off">
      <button class="primary" id="enter">명단 보기</button>
      <p class="msg" id="pinmsg" role="alert"></p>
    </div>
    ${foot(`<button class="textlink" id="home">처음 화면으로</button>`)}`;
  const go=()=>{if(document.getElementById("pin").value===PIN){S.view="board";render()}else document.getElementById("pinmsg").textContent="PIN이 맞지 않아요. 다시 입력해주세요."};
  document.getElementById("enter").onclick=go;
  document.getElementById("pin").onkeydown=e=>{if(e.key==="Enter")go()};
  document.getElementById("home").onclick=()=>{S.view="intro";render()};
}
function renderBoard(){
  app.innerHTML=`
    <div class="wall" aria-hidden="true"></div>
    <h1 style="font-size:34px">화성 신입 발령 명단</h1>
    <p class="lede" style="color:var(--muted)">리더는 부서마다 한 명, 같은 소속은 부서당 최대 두 명이에요.</p>
    <div class="board">${T.map(t=>{
      const ms=PEOPLE.map((p,i)=>({p,i})).filter(x=>ROSTER[x.i]===t);
      return `<section class="team" style="--tc:var(--${t})">
        <header>${CH[t]}<div><h2>${TYPES[t].post}</h2><p>사수 ${TYPES[t].chr}, ${ms.length}명</p></div></header>
        <ul>${ms.map(x=>`<li><span>${esc(x.p.n)}${x.p.r?` <small>${x.p.r}</small>`:""}</span><small>${x.p.o}팀</small></li>`).join("")}</ul>
      </section>`}).join("")}</div>
    ${foot(`<button class="textlink" id="home">처음 화면으로</button>`)}`;
  document.getElementById("home").onclick=()=>{S.view="intro";render()};
}
render();
</script>
</body>
</html>
